<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小手机</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column;color:#fff;background:linear-gradient(165deg,#f7efdd,#e6d5b4 55%,#cdb88f);transition:background .5s}
#stars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#stars b{position:absolute;color:rgba(255,255,255,.7);font-style:normal}
#bar{display:flex;justify-content:space-between;padding:12px 22px 4px;font-size:13px;letter-spacing:.06em;text-shadow:0 1px 4px rgba(0,0,0,.35)}
#deck{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory}
#deck::-webkit-scrollbar{display:none}
.pg{min-width:100%;scroll-snap-align:start;padding:6px 18px;overflow-y:auto}
.pg::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;padding-top:8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font:inherit;padding:0}
.app i{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:25px;filter:grayscale(1);box-shadow:0 5px 16px rgba(60,45,20,.22);font-style:normal;transition:transform .12s}
.app:active i{transform:scale(.9)}
.app span{font-size:11px;text-shadow:0 1px 4px rgba(0,0,0,.45)}
#dots{display:flex;justify-content:center;gap:6px;padding:8px 0 4px}
#dots b{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}
#dots b.on{background:#fff}
#dock{margin:0 14px 16px;padding:12px 10px;border-radius:26px;background:rgba(255,255,255,.22);backdrop-filter:blur(18px);display:flex;justify-content:space-around}
#dock .app i{width:50px;height:50px;font-size:22px}
.wg{margin:12px 0;padding:16px;border-radius:22px;background:rgba(255,255,255,.26);backdrop-filter:blur(14px);color:#fff}
.wg .big{font-size:44px;font-weight:300;line-height:1}
#sheet{position:fixed;inset:0;background:linear-gradient(170deg,#fdfaf3,#efe6d3);color:#4a4028;transform:translateY(100%);transition:transform .34s cubic-bezier(.22,.9,.3,1);z-index:20;display:flex;flex-direction:column}
#sheet.on{transform:translateY(0)}
#stop{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
#stop button{background:none;border:0;font-size:19px;color:#8a7850}
#sbody{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:0 18px 18px}
#sbody.scroll{overflow-y:auto;display:block;padding-bottom:28px}
#sbody h5{font-size:12px;color:#9a8961;letter-spacing:.12em;margin:16px 0 8px}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid #ddd0b4;background:#fffdf7;font:inherit;font-size:16px;color:#4a4028;margin:4px 0}
.btn{padding:10px 16px;border-radius:12px;border:0;background:#c9a877;color:#fff;font:inherit;font-size:14px}
.btn.g{background:rgba(201,168,119,.16);color:#8a7850}
.card{background:#fffdf7;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px rgba(150,125,80,.12)}
.walls{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.walls button{width:58px;height:58px;border-radius:14px;border:2px solid transparent}
.walls button.on{border-color:#c9a877}
.ct{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #e9e1d2;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#f1e3ce,#e2cdb0);display:grid;place-items:center;font-size:23px;color:#8a7850;flex:0 0 46px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.th{flex:1;min-height:0;overflow-y:auto;padding:10px 0}
.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;box-shadow:0 2px 8px rgba(150,125,80,.12)}
.msg.me .bub{background:#e6cfa6}
.msg .tm{font-size:11px;color:#a2957f;align-self:flex-end;margin:0 4px}
.cm{display:flex;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid #e9e1d2}
.cm textarea{flex:1;border:1px solid #ddd0b4;background:#fffdf7;border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;color:#4a4028;resize:none;max-height:96px;outline:none}
.cm button{width:38px;height:38px;border-radius:50%;border:0;background:#c9a877;color:#fff;font-size:17px}
html.dark #sheet{background:#0e0e12;color:#f2f2f5}
html.dark .ct{border-color:#26262e}
html.dark .av{background:#2a2a34;color:#d8d8e0}
html.dark .msg .bub{background:#2b2b33;color:#f2f2f5}
html.dark .msg.me .bub{background:#e8e8ec;color:#17171b}
html.dark .cm{border-color:#26262e}
html.dark .cm textarea{background:#1b1b22;color:#f2f2f5;border-color:#33333d}
html.dark .inp,html.dark .card,html.dark .btn.g{background:#1b1b22;color:#f2f2f5;border-color:#33333d}
html.dark #stop button{color:#c8c2b6}
</style>
</head>
<body>
<div id="app">
  <div id="stars"></div>
  <div id="bar"><span id="t">--:--</span><span>◐</span></div>
  <div id="deck">
    <section class="pg"><div class="grid" id="grid"></div></section>
    <section class="pg"><div class="wg" id="wgClock"></div><div class="wg" id="wgTodo"></div></section>
  </div>
  <div id="dots"></div>
  <div id="dock"></div>
</div>
<div id="sheet"><div id="stop"><button id="close">✕</button><b id="st"></b></div><div id="sbody"></div></div>
<script>
const WALLS={cream:'linear-gradient(165deg,#f7efdd,#e6d5b4 55%,#cdb88f)',sky:'radial-gradient(circle at 30% 18%,#33405f,#161c30 55%,#080b16)',dusk:'linear-gradient(170deg,#f8cba0,#e0897a 45%,#5e6d9f)',mist:'linear-gradient(170deg,#e2ecf4,#bdd0e2 50%,#93a9c6)'};
const K='mini.v2';
let S={wall:'cream',todos:[],diary:{},notes:[],chars:[],msgs:{},theme:'light'};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.innerHTML=x;return n};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const APPS=[['todo','待办','📋'],['diary','日记','📖'],['cal','日历','📅'],['note','便签','📝'],['music','音乐','🎧'],['chat','聊天','💬']];
const DOCK=[['todo','待办','📋'],['diary','日记','📖'],['chat','聊天','💬'],['set','设置','⚙']];
(function paint(){const a=$('#app');a.style.background=WALLS[S.wall]||WALLS.cream;const st=$('#stars');st.innerHTML='';
 for(let i=0;i<40;i++){const b=el('b',null,Math.random()<.35?'✦':'✧');b.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;font-size:'+(8+Math.random()*14)+'px;opacity:'+(.25+Math.random()*.5);st.append(b)}
 document.documentElement.classList.toggle('dark',S.theme==='dark');})();
function mk(a){const b=el('button','app');b.innerHTML='<i>'+a[2]+'</i><span>'+a[1]+'</span>';b.onclick=()=>open(a[0]);return b}
APPS.forEach(a=>$('#grid').append(mk(a)));
DOCK.forEach(a=>$('#dock').append(mk(a)));
for(let i=0;i<2;i++)$('#dots').append(el('b',i?'':'on'));
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');
 $('#t').textContent=p(d.getHours())+':'+p(d.getMinutes());
 const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
 $('#wgClock').innerHTML='<h4 style="margin:0 0 10px;font-size:13px;opacity:.9">'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+wd+'</h4><div class="big">'+p(d.getHours())+':'+p(d.getMinutes())+'</div><div style="font-size:12px;opacity:.85;margin-top:6px">'+S.todos.filter(t=>!t.done).length+' 件待办没做完</div>';
 $('#wgTodo').innerHTML='<h4 style="margin:0 0 10px;font-size:13px;opacity:.9">TO-DO</h4>'+(S.todos.length?S.todos.map(t=>'<div style="padding:5px 0;font-size:13px;'+(t.done?'text-decoration:line-through;opacity:.5':'')+'">'+(t.done?'✓ ':'· ')+esc(t.text)+'</div>').join(''):'<div style="font-size:12px;opacity:.7">还没有待办</div>');
}
setInterval(tick,1000);tick();
let cur=null,curChar=null,au=null,list=[],idx=0;
function scrollMode(on){$('#sbody').className=on?'scroll':''}
$('#close').onclick=()=>{$('#sheet').classList.remove('on');cur=null;if(au)au.pause()};
function open(id){cur=id;if(id!=='chat')curChar=null;$('#st').textContent={todo:'待办',diary:'日记',cal:'日历',note:'便签',music:'音乐',chat:'聊天',set:'设置'}[id];$('#sheet').classList.add('on');render()}
function render(){const b=$('#sbody');b.innerHTML='';
 if(cur==='todo'){scrollMode(true);b.append(el('h5',null,'今天要做的事'));
  S.todos.forEach((t,i)=>{const r=el('div','card');const c=document.createElement('input');c.type='checkbox';c.checked=t.done;c.style.cssText='width:18px;height:18px;accent-color:#c9a877';c.onchange=()=>{S.todos[i].done=c.checked;save();render();tick()};const x=el('button','','✕');x.style.cssText='float:right;border:0;background:none;color:#a9906a';x.onclick=()=>{S.todos.splice(i,1);save();render();tick()};r.append(c,el('span',null,esc(t.text)),x);b.append(r)});
  const i2=el('input','inp');i2.placeholder='加一件事';const bt=el('button','btn','加上');bt.onclick=()=>{if(!i2.value.trim())return;S.todos.push({text:i2.value.trim(),done:false});save();render();tick()};b.append(i2,bt);}
 else if(cur==='diary'){scrollMode(true);const k=new Date().toISOString().slice(0,10);
  const t=document.createElement('textarea');t.className='inp';t.rows=8;t.value=(S.diary[k]||'');t.placeholder='今天…';
  const bt=el('button','btn','保存');bt.onclick=()=>{S.diary[k]=t.value;save();bt.textContent='已保存'};
  b.append(el('h5',null,'只写给今天的自己'),t,bt);
  const ks=Object.keys(S.diary).sort().reverse().slice(0,10);
  if(ks.length){b.append(el('h5',null,'之前写过的'));ks.forEach(k2=>b.append(el('div','card','<b style="font-size:13px">'+k2+'</b><div style="margin-top:6px;font-size:14px;opacity:.85;white-space:pre-wrap">'+esc(S.diary[k2].slice(0,80))+'</div>')));}}
 else if(cur==='cal'){scrollMode(true);const d=new Date(),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  let h='<h5>'+y+' 年 '+(m+1)+' 月</h5><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:13px">';
  ['日','一','二','三','四','五','六'].forEach(x=>h+='<div style="opacity:.5">'+x+'</div>');
  for(let i=0;i<f;i++)h+='<div></div>';
  for(let i=1;i<=n;i++)h+='<div style="padding:7px 0;border-radius:50%;'+(i===d.getDate()?'background:#c9a877;color:#fff':'')+'">'+i+'</div>';
  b.innerHTML=h+'</div>';}
 else if(cur==='note'){scrollMode(true);b.append(el('h5',null,'便签'));
  S.notes.forEach((n,i)=>{const c=el('div','card');c.append(el('div',null,'<div style="font-size:14px;white-space:pre-wrap">'+esc(n)+'</div>'));const x=el('button','','✕');x.style.cssText='float:right;border:0;background:none;color:#a9906a';x.onclick=()=>{S.notes.splice(i,1);save();render()};c.append(x);b.append(c)});
  const t=document.createElement('textarea');t.className='inp';t.rows=3;t.placeholder='写一张新便签';const bt=el('button','btn','贴上去');bt.onclick=()=>{if(!t.value.trim())return;S.notes.push(t.value.trim());save();render()};b.append(t,bt);}
 else if(cur==='music'){scrollMode(true);b.append(el('h5',null,'本机音频'));
  const up=document.createElement('input');up.type='file';up.accept='audio/*';up.multiple=true;
  up.onchange=()=>{list=[...up.files];idx=0;play(0)};b.append(up);
  const tt=el('div','card','还没有选歌');tt.id='mt';b.append(tt);
  const bar=document.createElement('input');bar.type='range';bar.min=0;bar.max=100;bar.value=0;bar.style.width='100%';b.append(bar);
  const row=el('div');row.style.cssText='display:flex;gap:10px;margin-top:10px';
  const pv=el('button','btn g','上一首'),pp=el('button','btn','播放'),nx=el('button','btn g','下一首');row.append(pv,pp,nx);b.append(row);
  if(!au)au=new Audio();
  pp.onclick=()=>{if(!au.src)return;if(au.paused){au.play();pp.textContent='暂停'}else{au.pause();pp.textContent='播放'}};
  pv.onclick=()=>play((idx-1+list.length)%Math.max(list.length,1));
  nx.onclick=()=>play((idx+1)%Math.max(list.length,1));
  bar.oninput=()=>{if(au.duration)au.currentTime=au.duration*bar.value/100};
  au.ontimeupdate=()=>{bar.value=au.duration?au.currentTime/au.duration*100:0};
  play=function(i){if(!list.length)return;idx=i;au.src=URL.createObjectURL(list[i]);au.play();$('#mt').textContent='正在放：'+list[i].name;pp.textContent='暂停'};}
 else if(cur==='set'){scrollMode(true);b.append(el('h5',null,'壁纸'));
  const w=el('div','walls');Object.keys(WALLS).forEach(k=>{const x=el('button');x.style.background=WALLS[k];if(S.wall===k)x.classList.add('on');x.onclick=()=>{S.wall=k;save();paint();render()};w.append(x)});b.append(w);
  b.append(el('h5',null,'聊天外观'));
  const t1=el('button','btn' + (S.theme==='light'?'':' g'),'浅色');const t2=el('button','btn' + (S.theme==='dark'?'':' g'),'深色');
  t1.onclick=()=>{S.theme='light';save();paint();render()};t2.onclick=()=>{S.theme='dark';save();paint();render()};
  const tw=el('div');tw.style.cssText='display:flex;gap:10px';tw.append(t1,t2);b.append(tw);
  b.append(el('h5',null,'数据'));
  const rs=el('button','btn g','清空这台设备的记录');rs.onclick=()=>{if(confirm('清空待办、日记、便签和聊天？')){S={wall:S.wall,theme:S.theme,todos:[],diary:{},notes:[],chars:[],msgs:{}};save();paint();tick();render()}};b.append(rs);
  b.append(el('p','','都存在这台设备的浏览器里，不上传。'));}
 else if(cur==='chat'){curChar?thread(b):chatList(b)}
}
function avEl(v){const a=el('div','av');if(String(v||'').startsWith('data:')){const im=document.createElement('img');im.src=v;a.append(im)}else a.textContent=v||'✧';return a}
function chatList(b){scrollMode(true);const head=el('div');head.style.cssText='display:flex;justify-content:space-between;align-items:center';
 head.append(el('h5',null,'联系人'));const add=el('button','btn','＋ 新角色');add.onclick=()=>newChar(b);head.append(add);b.append(head);
 if(!S.chars.length)b.append(el('div','card','还没有角色。点右上角加一个，写他的名字和性格。'));
 S.chars.forEach(c=>{const r=el('div','ct');r.append(avEl(c.avatar));const info=el('div');info.style.flex='1';
  const ms=(S.msgs[c.id]||[]);info.append(el('b',null,esc(c.name)),el('div',null,'<span style="font-size:13px;opacity:.7">'+esc(ms.length?ms[ms.length-1].text.slice(0,28):'还没有聊过')+'</span>'));
  r.append(info);r.onclick=()=>{cur=null;curChar=c.id;$('#st').textContent=c.name;open('chat')};b.append(r)});}
function newChar(b){const n=el('input','inp');n.placeholder='名字';const a=el('input','inp');a.placeholder='头像符号或 emoji';const m=document.createElement('textarea');m.className='inp';m.rows=4;m.placeholder='性格、习惯、你们的关系…';
 const bt=el('button','btn','建好');bt.onclick=()=>{if(!n.value.trim())return;const id='c'+Date.now();S.chars.push({id,name:n.value.trim(),avatar:a.value.trim(),memo:m.value.trim()});S.msgs[id]=[];save();render()};
 b.append(el('h5',null,'新角色'),n,a,m,bt);}
function thread(b){$('#sbody').className='';const c=S.chars.find(x=>x.id===curChar);if(!c)return chatList(b);
 const head=el('div');head.style.cssText='display:flex;align-items:center;gap:10px;padding-bottom:8px';
 const bk=el('button','btn g','‹');bk.onclick=()=>{curChar=null;$('#st').textContent='聊天';render()};head.append(bk,avEl(c.avatar),el('b',null,esc(c.name)));b.append(head);
 const th=el('div','th');b.append(th);
 const ms=S.msgs[c.id]||[];
 if(!ms.length)th.append(el('div','card','还没有消息。写一句吧。'));
 ms.forEach((m,i)=>{const row=el('div','msg'+(m.me?' me':''));const bub=el('div',esc(m.text),'bub');
  bub.oncontextmenu=e=>{e.preventDefault();if(confirm('删掉这条？')){ms.splice(i,1);save();render()}};
  row.append(bub,el('span',new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),'tm'));th.append(row)});
 const cm=el('div','cm');const ta=document.createElement('textarea');ta.rows=1;ta.placeholder='写消息…';
 const sd=el('button','↑');sd.onclick=()=>{const v=ta.value.trim();if(!v)return;ms.push({me:1,text:v,t:Date.now()});S.msgs[c.id]=ms;save();render()};
 ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,96)+'px';sd.style.opacity=ta.value.trim()?'1':'.5'};
 cm.append(ta,sd);b.append(cm);
 c.memo&&b.append(el('div','','<span style="font-size:11px;opacity:.6">'+esc(c.memo.slice(0,60))+'</span>'));
 setTimeout(()=>{th.scrollTop=th.scrollHeight},30);}
$('#deck').addEventListener('scroll',()=>{const i=Math.round($('#deck').scrollLeft/$('#deck').clientWidth);document.querySelectorAll('#dots b').forEach((d,j)=>d.classList.toggle('on',j===i))});
</script>
</body>
</html>
